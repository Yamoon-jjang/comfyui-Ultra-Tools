name: Audit Comfy Registry version statuses

# Read-only: lists every Yamoon-jjang node pack and every version status
# (including deleted/banned) from the public Comfy Registry API.
# Never publishes, edits or deletes anything.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/registry-version-audit.yml"

permissions:
  contents: read

jobs:
  registry-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read public Registry statuses for all Yamoon-jjang node packs
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          API = "https://api.comfy.org"
          UA = {"User-Agent": "Ultra-Tools-Registry-Audit/2.0.2"}
          def get(path, params=None):
              url = API + path + ("?" + urllib.parse.urlencode(params, doseq=True) if params else "")
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
          known = ["comfyui-ultra-tools", "ultra-minimax-h3-prompt", "comfyui-ultra-qwen-image-editor",
                   "comfyui-ultra-lora-reference-images", "comfyui-ultra-image-pid"]
          code, pub = get("/publishers/yamoon-jjang/nodes")
          listed = []
          if isinstance(pub, list):
              listed = pub
          elif isinstance(pub, dict):
              listed = pub.get("nodes") or pub.get("items") or []
          print("PUBLISHER_NODES http", code, "count", len(listed))
          for n in listed:
              print("PUBNODE", n.get("id"), "|", n.get("name"), "| node_status", n.get("status"),
                    "| latest", (n.get("latest_version") or {}).get("version"))
          ids = list(dict.fromkeys(known + [n.get("id") for n in listed if n.get("id")]))
          statuses = ["NodeVersionStatusActive", "NodeVersionStatusPending", "NodeVersionStatusFlagged",
                      "NodeVersionStatusBanned", "NodeVersionStatusDeleted"]
          for node_id in ids:
              c1, node = get(f"/nodes/{node_id}")
              node_status = node.get("status") if isinstance(node, dict) else None
              c2, vers = get(f"/nodes/{node_id}/versions", {"include_status_reason": "true", "statuses": statuses})
              vers = vers if isinstance(vers, list) else []
              print(f"NODE {node_id} | http {c1} | node_status {node_status} | versions {len(vers)}")
              for v in sorted(vers, key=lambda x: x.get("createdAt", ""), reverse=True):
                  reason = str(v.get("status_reason") or "")
                  try:
                      parsed = json.loads(reason)
                      if isinstance(parsed, dict):
                          reason = parsed.get("message", "")
                      elif isinstance(parsed, list):
                          reason = "; ".join(f"{i.get('scanner')}:{i.get('file_path')}:{i.get('line_number')}:{(i.get('metadata') or {}).get('matched_patterns')}" for i in parsed if isinstance(i, dict))
                  except Exception:
                      pass
                  print(f"  VER {node_id} {v.get('version')} | {v.get('status')} | deprecated {v.get('deprecated')} | {str(v.get('createdAt'))[:16]} | {reason[:300]}")
          PY
