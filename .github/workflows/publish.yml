name: Publish to Comfy Registry

# pyproject.toml 의 version 을 올려서 main 브랜치에 올리면 자동으로 Registry 에 배포됩니다.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Yamoon-jjang' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      # git은 기본 설정에서 한글 파일명을 "\355\226..." 같은 표기로 내보내서,
      # 배포 zip을 만들 때 한글 이름의 글꼴·메뉴얼·예제가 빠짐. 원래 이름 그대로 내보내게 함
      - name: Keep Korean file names in the package
        run: git config --global core.quotePath false
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
